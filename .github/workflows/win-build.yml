name: win-build
on:
  push:
    branches: [rtl-build]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --package sonora --target x86_64-pc-windows-msvc
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-win-x64
          path: target/x86_64-pc-windows-msvc/release/sonora.exe

